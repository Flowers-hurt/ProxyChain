<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Build Clash proxy chains in your browser. No server upload." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eceff3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f14" />
    <title>ProxyChain — Build proxy chains in your browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const pref = JSON.parse(localStorage.getItem("proxychain-theme"))?.state?.pref;
        if (pref === "light" || pref === "dark") document.documentElement.dataset.theme = pref;
      } catch {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
